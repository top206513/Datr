name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/railway-last-dating-app-a0spp2]
  workflow_dispatch:

# Разрешения, нужные actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен последний коммит
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

      - name: Build
        env:
          # Сайт публикуется в подпапку /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages отдаёт 404.html при неизвестном пути; отдаём то же приложение
      - run: cp dist/index.html dist/404.html

      # Требуется один раз включить Pages вручную:
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      # Токену Actions не хватает прав, чтобы создать сайт самому.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
